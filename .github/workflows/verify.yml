name: Verify git-only milestone

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.13.7"
          enable-cache: false
      - name: Run all implemented verification tiers
        run: uv run --locked python tools/run_all.py
      - name: Test standalone Health presence probes with synthetic data
        run: uv run --locked python -m unittest discover -s spikes/health_coverage -p 'test_*.py' -v
      - name: Test private Health catalogue tools with synthetic data
        run: uv run --locked python -m unittest discover -s spikes/health_catalogue -p 'test_*.py' -v
