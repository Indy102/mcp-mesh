[project]
name = "mcp-mesh-contracts"
version = "0.8.0"
description = "Contract generation and validation for the Quantified-Self MCP Mesh (T1 tier)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "rfc3339-validator>=0.1.4,<0.2",
    "mcp>=2.1.1,<3",
    "duckdb>=1.1,<2",
]

[dependency-groups]
dev = []

[tool.uv]
package = false

[tool.mesh]
tiers = ["T1","T2","T3","T4"]
protocol_version = "2026-07-28"
